<!-- Site footer (05) — brand, contact, follow, newsletter.
     Styles: css/components/footer.css
     Paths are relative to the site root. -->

<footer id="contact" class="footer">
  <span class="corner corner--br" aria-hidden="true"></span>

  <div class="container footer-grid">
    <div class="footer-brand">
      <img class="brand-mark" src="assets/svg/icons/logo-violin.svg" alt="" width="38" height="38">
      <span>
        <span class="brand-name">Sumanth<br>Manjunath</span>
        <span class="brand-role">Carnatic Violinist</span>
      </span>
    </div>

    <div>
      <h2>Let's connect</h2>
      <p>For concerts, collaborations, workshops and enquiries.</p>
      <a class="btn" href="pages/contact.html">Get in touch
        <img src="assets/svg/icons/mail.svg" alt="" width="15" height="15"></a>
    </div>

    <div>
      <h2>Follow</h2>
      <div class="socials">
        <a href="#" aria-label="Instagram"><img src="assets/svg/icons/instagram.svg" alt="" width="15" height="15"></a>
        <a href="#" aria-label="YouTube"><img src="assets/svg/icons/youtube.svg" alt="" width="15" height="15"></a>
        <a href="#" aria-label="Facebook"><img src="assets/svg/icons/facebook.svg" alt="" width="15" height="15"></a>
        <a href="#" aria-label="Spotify"><img src="assets/svg/icons/spotify.svg" alt="" width="15" height="15"></a>
      </div>
    </div>

    <div class="newsletter">
      <h2>Newsletter</h2>
      <p>Stay updated with upcoming concerts and music releases.</p>
      <form data-newsletter novalidate>
        <label class="visually-hidden" for="nl-email">Email address</label>
        <input id="nl-email" type="email" name="email" placeholder="Your email address" autocomplete="email" required>
        <button type="submit" aria-label="Subscribe">
          <img src="assets/svg/icons/plane.svg" alt="" width="17" height="17">
        </button>
      </form>
      <p class="form-note" data-form-note role="status"></p>
    </div>
  </div>

  <p class="container colophon">
    <span>&copy; 2024 Sumanth Manjunath. All rights reserved.</span>
    <span>Designed with <img src="assets/svg/icons/heart.svg" alt="love" width="13" height="13"> for music &amp; heritage</span>
  </p>
</footer>
