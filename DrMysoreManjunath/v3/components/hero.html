<!-- Hero module (01) — headline, artist, temple, particles, wave.
     Styles: css/components/hero.css
     Paths are relative to the site root. -->

<section id="home" class="hero">
    <span class="corner corner--tl" aria-hidden="true"></span>
    <span class="corner corner--tr" aria-hidden="true"></span>

    <img class="hero-temple" src="assets/images/hero/temple.png" alt=""
         width="116" height="226" aria-hidden="true">
    <canvas class="hero-particles" data-particles aria-hidden="true"></canvas>
    <img class="hero-art" src="assets/images/hero/hero-artist.png"
         alt="Sumanth Manjunath performing on the Carnatic violin"
         width="456" height="434" fetchpriority="high" decoding="async">

    <div class="container hero-content">
      <h1>A Legacy<br>of Strings.<br>A Voice Without<br>Borders.</h1>
      <img class="rule" src="assets/svg/decorative/diamond-rule.svg" alt="" width="360" height="16">
      <p class="lede">Rooted in tradition. Inspired by the world.</p>
      <p class="hero-meta">
        <span>Carnatic Violinist</span><span>Composer</span><span>Performer</span>
      </p>
      <div class="hero-actions">
        <a class="btn btn--primary" href="#about">Explore my journey
          <img src="assets/svg/icons/arrow-right.svg" alt="" width="15" height="15"></a>
        <a class="btn" href="#music">Listen to music
          <img src="assets/svg/icons/play.svg" alt="" width="15" height="15"></a>
      </div>
    </div>

    <p class="hero-rail" aria-hidden="true"><b>01</b><span>Hero</span><span>Module</span></p>

    <a class="promo-tab" href="pages/media.html">
      <img src="assets/svg/icons/play.svg" alt="" width="20" height="20">
      <span>Promo video</span>
    </a>

    <div class="hero-wave" aria-hidden="true">
      <img src="assets/svg/decorative/wave-divider.svg" alt="" width="1440" height="80">
      <img class="lotus" src="assets/svg/decorative/lotus.svg" alt="" width="64" height="40">
    </div>
  </section>
